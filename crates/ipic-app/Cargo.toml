[package]
name = "ipic-app"
description = "ipic GUI: multimodal file manager with on-device semantic search"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ipic"
path = "src/main.rs"

[lib]
name = "ipic"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["image"] }
ipic-core = { path = "../ipic-core" }
ipic-rag = { path = "../ipic-rag" }
rusqlite = "0.40.2"
trash = "5.2.6"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["eframe"] }
