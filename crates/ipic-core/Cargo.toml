[package]
name = "ipic-core"
description = "Parallel filesystem scanner, SQLite catalog and change watcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
libc = "0.2.189"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
