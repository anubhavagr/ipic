[workspace]
resolver = "2"
members = ["crates/ipic-core", "crates/ipic-rag", "crates/ipic-cli", "crates/ipic-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Unwind semantics are required: the engine contains malformed-PDF panics
# via catch_unwind (a global cargo config may set panic=abort otherwise).
panic = "unwind"
