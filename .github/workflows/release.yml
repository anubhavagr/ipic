---
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: macOS DMG (Apple Silicon)
    # arm64 runner: builds natively for aarch64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary (tuned for Apple Silicon)
        env:
          # apple-m1 is the lowest Apple Silicon baseline: the binary runs on
          # every M-series chip, and NEON/crypto paths stay compiler-tuned.
          RUSTFLAGS: "-C target-cpu=apple-m1"
        run: cargo build --release -p ipic-app --target aarch64-apple-darwin

      - name: Bundle .app and pack DMG
        run: scripts/make-dmg.sh target/aarch64-apple-darwin/release/ipic

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipic-dmg
          path: dist/*.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            **ipic for macOS (Apple Silicon, arm64)**

            Download the `.dmg`, open it, and drag ipic into Applications.

            Notes:
            - Built with `-C target-cpu=apple-m1`: runs on every Apple Silicon Mac (M1 through M4).
            - The build is ad-hoc signed. On first launch, right-click the app and choose **Open** (Gatekeeper will remember the choice).
            - Models (embedder, vision, whisper) download once on first run and stay on-device; searches never leave the machine.
